<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Squad Fit — Redesign</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-25..0">
<style>
  html,body{margin:0;background:#0B0D12;color:#F5F6F8;font-family:"Inter",system-ui,sans-serif;min-height:100vh}
  body{background:
    radial-gradient(ellipse 1200px 600px at 20% -10%, rgba(250,128,56,.06), transparent 70%),
    radial-gradient(ellipse 1000px 600px at 100% 50%, rgba(255,59,139,.04), transparent 70%),
    #0B0D12;
  }
  .wrap{padding:32px 24px 80px;display:flex;flex-wrap:wrap;gap:40px;justify-content:center;align-items:flex-start}
  .frame{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
  .frame-label{font:700 10px "Inter";color:#9CA3AF;letter-spacing:.18em;text-transform:uppercase}
  .phone{width:390px;height:810px;background:#0B0D12;border-radius:48px;border:9px solid #1A1C22;overflow:hidden;position:relative;box-shadow:0 50px 100px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
  .phone .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:114px;height:32px;background:#000;border-radius:22px;z-index:50}
  .phone .status{position:absolute;top:0;left:0;right:0;height:50px;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:18px 28px 0;pointer-events:none;font:600 14px "Inter";color:#fff}
  .phone .home-ind{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:130px;height:4px;background:rgba(255,255,255,.3);border-radius:999px;z-index:60;pointer-events:none}
  .phone-body{position:absolute;inset:50px 0 0 0;overflow:auto;scrollbar-width:none}
  .phone-body::-webkit-scrollbar{display:none}
  .with-tabs .phone-body{bottom:82px;inset:50px 0 82px 0}
  .tabbar{position:absolute;bottom:0;left:0;right:0;z-index:40}
  .header{width:100%;text-align:center;margin-bottom:16px;padding:0 24px}
  h1{font:900 52px/1 "Space Grotesk";letter-spacing:-0.04em;color:#fff;margin:0 0 12px}
  h1 .accent{background:linear-gradient(135deg,#FA8038,#FF3B8B 60%,#D6FF3B);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font:500 15px "Inter";color:#9CA3AF;max-width:620px;margin:0 auto;line-height:1.55}
  .meta-row{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .meta-chip{font:700 10px "Inter";letter-spacing:.14em;text-transform:uppercase;color:#9CA3AF;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .section-heading{width:100%;flex-basis:100%;padding:24px 24px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .section-kicker{font:700 10px "Inter";color:#FA8038;letter-spacing:.22em;text-transform:uppercase}
  .section-title{font:900 32px "Space Grotesk";color:#fff;letter-spacing:-0.03em}
</style>
</head>
<body>
  <div class="header" style="padding:56px 24px 8px">
    <h1>Squad Fit <span class="accent">redesign</span></h1>
    <div class="sub">Login · Home · Treino ativo · Perfil · Ranking do squad — um refresh premium do app Flutter com micro-interações, números grandes e momentos elétricos da marca.</div>
    <div class="meta-row">
      <span class="meta-chip">pt-BR</span>
      <span class="meta-chip">12 telas e modais</span>
      <span class="meta-chip">Design system · Squad Fit</span>
      <span class="meta-chip">React + JSX</span>
    </div>
  </div>
  <div class="wrap" id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="Logo.jsx"></script>
  <script type="text/babel" src="Components.jsx"></script>
  <script type="text/babel" src="Screens.jsx"></script>
  <script type="text/babel" src="Screens2.jsx"></script>
  <script type="text/babel" src="Modals.jsx"></script>
  <script type="text/babel" data-presets="react">
    function Phone({label, children, withTabs=false, activeTab='home', modal=null, underlyingActive='home'}) {
      return (
        <div className="frame" data-screen-label={label}>
          <div className="frame-label">{label}</div>
          <div className={"phone " + (withTabs?"with-tabs":"")}>
            <div className="island"/>
            <div className="status">
              <span>9:41</span>
              <span style={{display:'flex',gap:6,alignItems:'center'}}>
                <Icon name="signal_cellular_alt" size={14}/>
                <Icon name="wifi" size={14}/>
                <Icon name="battery_full" size={16}/>
              </span>
            </div>
            <div className="phone-body">{children}</div>
            {withTabs && <div className="tabbar"><BottomTabBar active={activeTab}/></div>}
            {modal}
            <div className="home-ind"/>
          </div>
        </div>
      );
    }

    function App(){
      return (
        <>
          <div className="section-heading">
            <span className="section-kicker">Telas</span>
            <span className="section-title">Fluxos principais</span>
          </div>
          <Phone label="01 · Login"><LoginScreen/></Phone>
          <Phone label="02 · Home" withTabs activeTab="home"><HomeScreen/></Phone>
          <Phone label="03 · Treino ativo"><TreinoAtivoScreen/></Phone>
          <Phone label="04 · Diário" withTabs activeTab="diario"><DiarioScreen/></Phone>
          <Phone label="05 · Squads" withTabs activeTab="ranking"><SquadsScreen/></Phone>
          <Phone label="06 · Ranking do squad" withTabs activeTab="ranking"><RankingScreen/></Phone>
          <Phone label="07 · Perfil" withTabs activeTab="perfil"><PerfilScreen/></Phone>

          <div className="section-heading">
            <span className="section-kicker">Modais</span>
            <span className="section-title">Interações essenciais</span>
          </div>
          <Phone label="M1 · Adicionar alimento" withTabs activeTab="diario" modal={<ModalAdicionarAlimento/>}><DiarioScreen/></Phone>
          <Phone label="M2 · Criar squad" withTabs activeTab="ranking" modal={<ModalCriarSquad/>}><SquadsScreen/></Phone>
          <Phone label="M3 · Entrar com código" withTabs activeTab="ranking" modal={<ModalEntrarCodigo/>}><SquadsScreen/></Phone>
          <Phone label="M4 · Convidar amigos" withTabs activeTab="ranking" modal={<ModalConvidarAmigos/>}><SquadsScreen/></Phone>
          <Phone label="M5 · Confirmar exclusão" withTabs activeTab="perfil" modal={<ModalConfirmarExclusao/>}><PerfilScreen/></Phone>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body></html>
